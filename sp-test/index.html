<title>HOLO LAB ? ORB / TEST 26</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
#app{height:100%;display:flex;flex-direction:column;padding:8px 12px;background:#000}

@media(orientation:portrait){
 #app{position:absolute;width:100vh;height:100vw;left:0;top:100%;transform-origin:0 0;transform:rotate(-90deg)}
}

<header><b>HOLO LAB</b><span>? ORB / TEST 26</span><div><button id=tilt>TILT ACT</button><button id=reset>RESET</button></div></header>
<main>
